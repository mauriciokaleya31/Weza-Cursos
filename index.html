<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weza Solutions</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a library tries to overwrite window.fetch
      (function() {
        try {
          const propertyDescriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (propertyDescriptor && !propertyDescriptor.configurable) {
            console.warn('window.fetch is not configurable, skipping protection');
            return;
          }
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { console.warn('Something tried to overwrite window.fetch - assignment blocked.'); },
            configurable: true
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
